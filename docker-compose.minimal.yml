version: '3.8'

# Minimal configuration for low-resource servers (1 CPU, 2GB RAM)
# Use this on small VPS or cloud instances

services:
  scraper-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-crawl4ai-scraper-minimal
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/')"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    # No resource limits - let Docker use what's available
    # Good for 1 CPU / 1-2GB RAM servers

